<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жишиг — Шүүхийн шийдвэрийн шинжилгээ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#faf9f6; --sunk:#f0efea;
  --ink:#15171c; --ink-2:#4d4f55; --muted:#7d7e78;
  --line:#e4e2da; --line-2:#efeee8;
  --brand:#1d2b4f; --brand-ink:#ffffff; --brand-soft:#e8ecf5;
  --accent:#9a6a12; --accent-soft:#f7eedb;
  --ai:#5a47c7; --ai-soft:#efecfc;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --neg:#e34948; --good:#006300; --warn:#fab219; --crit:#d03b3b;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --seq1:#cde2fb; --seq7:#0d366b;
  --shadow:0 1px 2px rgba(20,23,28,.04),0 4px 16px rgba(20,23,28,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0f1013; --surface:#18191c; --surface-2:#1d1e22; --sunk:#141518;
    --ink:#f3f2ee; --ink-2:#c3c2b7; --muted:#8f9089;
    --line:#2c2d30; --line-2:#232427;
    --brand:#e6ebf7; --brand-ink:#131a2e; --brand-soft:#1f2740;
    --accent:#e0ac4c; --accent-soft:#2c2413;
    --ai:#a598f3; --ai-soft:#231f3a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --neg:#e66767; --good:#0ca30c;
    --grid:#2c2c2a; --axis:#383835;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0f1013; --surface:#18191c; --surface-2:#1d1e22; --sunk:#141518;
  --ink:#f3f2ee; --ink-2:#c3c2b7; --muted:#8f9089;
  --line:#2c2d30; --line-2:#232427;
  --brand:#e6ebf7; --brand-ink:#131a2e; --brand-soft:#1f2740;
  --accent:#e0ac4c; --accent-soft:#2c2413;
  --ai:#a598f3; --ai-soft:#231f3a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --neg:#e66767; --good:#0ca30c;
  --grid:#2c2c2a; --axis:#383835;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em}
.num{font-variant-numeric:tabular-nums}
mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:62px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Source Serif 4",serif;font-weight:700;font-size:21px;white-space:nowrap}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 12px;border-radius:9px;color:var(--ink-2);font-weight:500;font-size:14px;white-space:nowrap}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--ink)}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--sunk)}
.qsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px;height:36px;width:230px;color:var(--muted);cursor:text;white-space:nowrap;overflow:hidden;font-size:13.5px}
.qsearch kbd{margin-left:auto;font:11px Inter;border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.demo-banner{background:var(--accent-soft);color:var(--accent);font-size:12.5px;text-align:center;padding:6px 16px;font-weight:500}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-h h3{font-size:17px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:9px 16px;font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ai{background:var(--ai);border-color:var(--ai);color:#fff}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.chip.click{cursor:pointer} .chip.click:hover{border-color:var(--ink-2);color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.full{background:color-mix(in srgb,var(--s1) 14%,transparent);color:var(--s1)}
.tag.part{background:color-mix(in srgb,var(--s3) 16%,transparent);color:var(--s3)}
.tag.dis{background:color-mix(in srgb,var(--s2) 14%,transparent);color:var(--s2)}
.tag.neu{background:var(--sunk);color:var(--ink-2)}
.tag.ai{background:var(--ai-soft);color:var(--ai)}
.law{font-family:"JetBrains Mono",monospace;font-size:12px;background:var(--brand-soft);color:var(--ink);border-radius:6px;padding:2px 7px;white-space:nowrap;cursor:pointer}
.law:hover{outline:1px solid var(--ink-2)}
.ai-badge{display:inline-flex;align-items:center;gap:5px;color:var(--ai);font-size:12px;font-weight:600;letter-spacing:.02em}
.ai-panel{background:linear-gradient(180deg,var(--ai-soft),transparent 140px),var(--surface)}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.hr{height:1px;background:var(--line-2);margin:16px 0}
.section{padding-top:28px;padding-bottom:28px}
.page-head{padding-top:28px;padding-bottom:8px}
.page-head h1{font-size:30px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:8px}
.crumbs a:hover{color:var(--ink)}

/* ---------- Stat tiles ---------- */
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:13px;color:var(--ink-2);margin-top:4px}
.stat .d{font-size:12.5px;margin-top:6px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--neg)}

/* ---------- Charts ---------- */
.stack{display:flex;gap:2px;height:30px;border-radius:6px;overflow:hidden}
.stack .seg{min-width:4px;cursor:default}
.stack .seg:hover{filter:brightness(1.1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbars .r{display:grid;grid-template-columns:minmax(110px,190px) 1fr 64px;align-items:center;gap:12px;padding:6px 0;font-size:13.5px}
.hbars .track{height:12px;background:var(--sunk);border-radius:0 4px 4px 0;position:relative}
.hbars .fill{height:100%;border-radius:0 4px 4px 0;background:var(--s1)}
.hbars .avgline{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2);opacity:.6}
.div-bars .r{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 52px;align-items:center;gap:12px;padding:8px 0;font-size:13.5px;border-bottom:1px solid var(--line-2)}
.div-bars .r:last-child{border-bottom:0}
.div-bars .axis{position:relative;height:14px}
.div-bars .axis::before{content:"";position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;background:var(--axis)}
.div-bars .b{position:absolute;top:0;height:100%}
.div-bars .b.pos{left:50%;background:var(--s1);border-radius:0 4px 4px 0}
.div-bars .b.neg{right:50%;background:var(--neg);border-radius:4px 0 0 4px}
.cols{display:flex;align-items:flex-end;gap:2px;height:150px;border-bottom:1px solid var(--axis);padding-top:8px}
.cols .c{flex:1;background:var(--s1);border-radius:4px 4px 0 0;position:relative;min-height:2px}
.cols .c.hl{background:var(--accent)}
.cols .c:hover{filter:brightness(1.12)}
.cols-x{display:flex;gap:2px;font-size:11.5px;color:var(--muted);margin-top:6px}
.cols-x span{flex:1;text-align:center;white-space:nowrap}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{font:11px Inter,sans-serif;fill:var(--muted)}
svg.chart .gl{stroke:var(--grid);stroke-width:1}
svg.chart .bl{stroke:var(--axis);stroke-width:1}
svg.chart .hit{fill:transparent}
svg.chart .hit:hover{fill:var(--ink);fill-opacity:.04}
.heat{display:grid;gap:2px;font-size:12px}
.heat .cell{border-radius:4px;height:30px;display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums}
.heat .lab{display:flex;align-items:center;color:var(--ink-2);padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat .xl{text-align:center;color:var(--muted)}
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:8px;max-width:280px;opacity:0;transition:opacity .08s;line-height:1.45;box-shadow:0 6px 20px rgba(0,0,0,.2)}
#tip b{font-weight:600}

/* ---------- Home ---------- */
.hero{padding-top:56px;padding-bottom:36px;text-align:center}
.hero h1{font-size:clamp(30px,4.6vw,50px);line-height:1.12;max-width:860px;margin:0 auto}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:17px;color:var(--ink-2);max-width:640px;margin:16px auto 0}
.composer{max-width:860px;margin:30px auto 0;text-align:left;padding:6px}
.mode-tabs{display:flex;gap:4px;padding:6px 6px 0}
.mode-tabs button{border:0;background:none;padding:8px 12px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.mode-tabs button.on{background:var(--sunk);color:var(--ink)}
.composer textarea{width:100%;border:0;background:transparent;resize:none;padding:14px 16px;font-size:16px;line-height:1.6;min-height:120px;outline:none}
.composer .bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.feature{padding:22px}
.feature .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);margin-bottom:14px}
.feature h3{font-size:18px;margin-bottom:6px}
.feature p{margin:0;color:var(--ink-2);font-size:14px}
.list-item{display:flex;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.list-item:last-child{border-bottom:0}
.list-item:hover{background:var(--surface-2)}

/* ---------- Match ---------- */
.match-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.sticky{position:sticky;top:80px}
.story{font-size:14px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;line-height:1.6}
.story mark{background:var(--accent-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.fact{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.fact:last-child{border-bottom:0}
.fact .k{color:var(--muted)}
.fact .v{font-weight:500;text-align:right}
.ev{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0}
.dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.dot.y{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.dot.n{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.dot.q{background:var(--sunk);color:var(--muted)}
.question{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:8px;background:var(--surface)}
.question .opts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.verdict{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.big{font-family:"Source Serif 4",serif;font-size:64px;font-weight:700;line-height:1;letter-spacing:-.03em}
.alert{display:flex;gap:12px;border-radius:12px;padding:14px 16px;font-size:14px;align-items:flex-start}
.alert.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent)}
.alert.conf{background:var(--ai-soft);border:1px solid color-mix(in srgb,var(--ai) 30%,transparent)}
.alert .ic{flex:none;font-size:16px;line-height:1.3}
.case-row{display:grid;grid-template-columns:58px 1fr;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line-2);cursor:pointer}
.case-row:hover{background:var(--surface-2)}
.case-row:last-child{border-bottom:0}
.sim{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:conic-gradient(var(--s1) calc(var(--p)*1%),var(--sunk) 0);position:relative}
.sim::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface)}
.sim span{position:relative;z-index:1;font-size:13px}
.case-meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:2px}
.case-title{font-weight:600;font-size:15px}
.why{font-size:13px;color:var(--ink-2);margin-top:8px}
.why b{color:var(--ink);font-weight:600}
.args .a{padding:12px 14px;border-radius:10px;border:1px solid var(--line-2);margin-bottom:10px;font-size:13.5px;background:var(--surface-2)}
.args blockquote{margin:6px 0 0;font-family:"Source Serif 4",serif;font-size:14.5px;color:var(--ink);border-left:3px solid var(--line);padding-left:10px}
.steps .s{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.steps .s:last-child{border-bottom:0}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .st{flex:1;min-width:130px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);position:relative}
.flow .st:first-child{border-radius:10px 0 0 10px}
.flow .st:last-child{border-radius:0 10px 10px 0}
.flow .st + .st{border-left:0}
.flow .st .v{font-size:20px;font-weight:700}
.flow .st .l{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- Search ---------- */
.search-grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.searchbar{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:15.5px;padding:6px 0;min-width:0}
.facet{padding:14px 18px;border-bottom:1px solid var(--line-2)}
.facet:last-child{border-bottom:0}
.facet h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facet label{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0;cursor:pointer}
.facet label .c{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.facet input[type=checkbox]{accent-color:var(--brand);width:15px;height:15px}
.facet select,.facet input[type=text]{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface-2);font-size:13.5px}
.range{display:flex;gap:8px}
.result{padding:18px 20px;border-bottom:1px solid var(--line-2);cursor:pointer}
.result:hover{background:var(--surface-2)}
.result:last-child{border-bottom:0}
.result .sum{font-size:14px;color:var(--ink-2);margin:8px 0 10px}
.result .sum mark{background:var(--accent-soft);color:var(--ink);padding:0 2px;border-radius:3px}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.active-filters .chip{background:var(--brand-soft);border-color:transparent;color:var(--ink)}

/* ---------- Case ---------- */
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.doc{font-family:"Source Serif 4",serif;font-size:16.5px;line-height:1.75;padding:40px 48px}
.doc h2{font-size:15px;text-align:center;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
.doc .sec{font-family:Inter,sans-serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:28px 0 8px;display:flex;align-items:center;gap:8px}
.doc .sec::after{content:"";flex:1;height:1px;background:var(--line-2)}
.doc p{margin:0 0 12px}
.doc .hl-fact{background:color-mix(in srgb,var(--s1) 12%,transparent);border-radius:3px}
.doc .hl-reason{background:var(--accent-soft);border-radius:3px}
.doc .hl-law{background:var(--brand-soft);border-radius:3px}
.chain{display:flex;flex-direction:column;gap:0}
.chain .n{display:grid;grid-template-columns:22px 1fr;gap:10px;position:relative;padding-bottom:14px}
.chain .n:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.chain .b{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:10px}
.chain .n.cur .b{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:12px;font-size:13.5px;max-width:92%}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:4px}
.msg.bot cite{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:6px}
.chat-in{display:flex;gap:8px;margin-top:12px}

function cols(vals,labels,{hl=-1,unit=""}={}){
  const m = Math.max(...vals);
  return `<div class="cols">${vals.map((v,i)=>`<div class="c ${i===hl?"hl":""}" style="height:${v/m*100}%" data-tip="<b>${labels[i]}</b><br>${v}${unit}"></div>`).join("")}</div>
  <div class="cols-x">${labels.map(l=>`<span>${l}</span>`).join("")}</div>`;
}
function lineChart(labels,series,{h=230,yfmt=v=>fmt(v)}={}){
  const W=640,H=h,L=46,R=series.length>1?96:16,T=14,B=28, iw=W-L-R, ih=H-T-B;
  const all=series.flatMap(s=>s.vals); let max=Math.max(...all);
  const step=Math.pow(10,Math.floor(Math.log10(max)))/ (max/Math.pow(10,Math.floor(Math.log10(max)))<3?2:1);
  max=Math.ceil(max/step)*step;
  const x=i=>L+(labels.length===1?iw/2:i*iw/(labels.length-1)), y=v=>T+ih-(v/max)*ih;
  let g="";
  for(let v=0;v<=max+1e-9;v+=step){g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${yfmt(v)}</text>`}
  g+=`<line class="bl" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>`;
  labels.forEach((l,i)=>{ if(labels.length<=12||i%2===0) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  series.forEach(s=>{
    g+=`<path d="${s.vals.map((v,i)=>(i?"L":"M")+x(i)+" "+y(v)).join("")}" fill="none" stroke="var(${s.c})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=s.vals.length-1;
    g+=`<circle cx="${x(li)}" cy="${y(s.vals[li])}" r="4" fill="var(${s.c})" stroke="var(--surface)" stroke-width="2"/>`;
    if(series.length>1) g+=`<text x="${x(li)+10}" y="${y(s.vals[li])+4+(s.dy||0)}" style="fill:var(--ink-2);font-weight:500">${s.name}</text>`;
  });
  const cw=iw/Math.max(1,labels.length-1);
  labels.forEach((l,i)=>{
    const tip=`<b>${l}</b>`+series.map(s=>`<br>${s.name}: ${yfmt(s.vals[i])}`).join("");
    g+=`<rect class="hit" x="${x(i)-cw/2}" y="${T}" width="${cw}" height="${ih}" data-tip="${tip.replace(/"/g,"&quot;")}"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function seqColor(t){ // one-hue blue ramp, light -> dark
  const ramp=["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#256abf","#184f95","#0d366b"];
  const i=Math.min(ramp.length-1,Math.floor(t*(ramp.length-1)+.0001)); return ramp[i];
}
function heatmap(rows,colsL,data){
  const m=Math.max(...data.flat());
  let h=`<div class="heat" style="grid-template-columns:minmax(120px,170px) repeat(${colsL.length},1fr)"><div></div>${colsL.map(c=>`<div class="xl">${c}</div>`).join("")}`;
  rows.forEach((r,ri)=>{
    h+=`<div class="lab">${r}</div>`;
    data[ri].forEach((v,ci)=>{const t=v/m; h+=`<div class="cell" style="background:${seqColor(t)};color:${t>.5?"#fff":"#1d2b4f"}" data-tip="<b>${r}</b> · ${colsL[ci]}<br>${fmt(v)} шийдвэр">${v>=1000?(v/1000).toFixed(1)+"k":v}</div>`});
  });
  return h+"</div>";
}

function tog(k,v){ F[k].has(v)?F[k].delete(v):F[k].add(v); renderResults(); }

  const a = qa&&qa[q] ? qa[q] : qa ? {t:"Энэ шийдвэрт: мөнгө хариуцагчийн дансанд шилжсэн, хариуцагч төлөхөө бичгээр амласан тул шүүх түүнийг зээлдэгч гэж үзсэн. Дэлгэрэнгүйг “Шинжилгээ” табаас харна уу.",cite:"Үндэслэх хэсэг"} : /нотлох/.test(q)?{t:"Шүүх (1) банкны гүйлгээний баримт, (2) хариуцагчийн 2023.09.03-ны мессежийг зээлийн харилцааг нотолсон гэж үзсэн. Хариуцагчийн “хамтын ажиллагаа” гэсэн тайлбарыг нотлоогүй тул хүлээн аваагүй.",cite:"Үндэслэх хэсэг, 3–4-р догол мөр"}
    : /хүү/i.test(q)?{t:"Энэ шийдвэрт хүүгийн шаардлага гаргаагүй. Ижил төрлийн хэргүүдэд хүүг бичгээр тохиролцоогүй бол ИХ 281.3-ын дагуу ихэнхдээ хангадаггүй (31 хэргийн 24-т).",cite:"Холбоотой 31 шийдвэрийн дүн шинжилгээ"}
    : {t:"Таны хэрэгтэй адил: бичгээр гэрээгүй, банкны гүйлгээтэй, мессежээр хүлээн зөвшөөрсөн. Ялгаа: энэ хэрэгт хариуцагч шүүхэд ирж маргасан; таны хэрэгт хариуцагч холбоо тасалсан тул эзгүйд шийдвэрлэх (ИХШХШТХ 100) боломжийг анхаарна уу.",cite:"Таны хэргийн мэдээлэл + Тодорхойлох хэсэг"};
  chatLog.push({t:`<span class="skeleton">Уншиж байна…</span>`});
  $("#chat").innerHTML=chatHTML(); const i=$("#chatIn"); if(i) i.value="";
  setTimeout(()=>{chatLog.pop();chatLog.push(a);$("#chat").innerHTML=chatHTML();},700);
}

function render(keepScroll){
  const full=location.hash.replace(/^#\/?/,""); const [h,qs]=full.split("?"); const [r,arg]=h.split("/");
  if(r==="search"&&qs){ const v=new URLSearchParams(qs).get("q"); if(v!=null) F.q=v; }
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.r===(r==="case"?"search":r)));
  const app=$("#app"); const y=scrollY;
  const pages={"":pageHome,match:pageMatch,search:pageSearch,case:()=>pageCase(arg),judge:pageJudge,law:pageLaw,trends:pageTrends,folder:pageFolder};
  app.innerHTML=(pages[r]||pageHome)()+`<footer><div class="wrap row" style="justify-content:space-between"><span>Жишиг · Эх сурвалж: shuukh.mn нээлттэй шийдвэрүүд</span><span>Хууль зүйн зөвлөгөө биш — мэргэжлийн хуульчтай зөвлөлдөнө үү.</span></div></footer>`;
  if(r==="search") renderResults();
  if(keepScroll) scrollTo(0,y); else scrollTo(0,0);
}
function toast(t){ const el=document.createElement("div"); el.textContent=t; el.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.2)"; document.body.appendChild(el); setTimeout(()=>el.remove(),1800); }
window.addEventListener("hashchange",()=>{chatLog=[];caseTab=0;render()});
document.addEventListener("keydown",e=>{ if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)&&!document.activeElement.isContentEditable){e.preventDefault();location.hash="#/search";setTimeout(()=>$("#q")?.focus(),50)} });
$("#themeBtn").onclick=()=>{ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; try{localStorage.setItem("theme",d.dataset.theme)}catch(e){} };
try{const t=localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme=t;}catch(e){}
// tooltip
const tip=$("#tip");
document.addEventListener("mousemove",e=>{ const t=e.target.closest&&e.target.closest("[data-tip]"); if(!t){tip.style.opacity=0;return}
  tip.innerHTML=t.getAttribute("data-tip"); tip.style.opacity=1;
  const w=tip.offsetWidth, x=Math.min(innerWidth-w-8,e.clientX+14); tip.style.left=x+"px"; tip.style.top=(e.clientY+16)+"px"; });
render();
